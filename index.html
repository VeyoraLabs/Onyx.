<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onyx AI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fb;
      color: #20243a;
    }
    header {
      padding: 22px;
      background: white;
      border-bottom: 1px solid #e5e7ef;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 700px;
      margin: 70px auto;
      padding: 24px;
      text-align: center;
    }
    .chat {
      margin-top: 30px;
      padding: 18px;
      background: white;
      border: 1px solid #e5e7ef;
      border-radius: 18px;
    }
    textarea {
      width: 95%;
      min-height: 90px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
    }
    button {
      margin-top: 12px;
      padding: 12px 22px;
      background: #5146e5;
      color: white;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
    }
    #reply {
      white-space: pre-wrap;
      text-align: left;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>✦ Onyx AI</header>
  <main>
    <h1>Your AI workspace</h1>
    <p>Think, create, learn and get things done.</p>
    <div class="chat">
      <textarea id="message" placeholder="Message Onyx AI..."></textarea>
      <br>
      <button onclick="sendMessage()">Send message</button>
      <div id="reply"></div>
    </div>
  </main>
  <script>
    async function sendMessage() {
      const message = document.getElementById("message").value.trim();
      const reply = document.getElementById("reply");
      if (!message) return;
      reply.textContent = "Connecting to Onyx AI...";
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            messages: [{role: "user", content: message}],
            mode: "chat"
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Connection failed");
        reply.textContent = data.reply;
      } catch (error) {
        reply.textContent = "AI isn't connected yet. We'll set up the backend next.";
      }
    }
  </script>
</body>
